<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12151A">
<title>스마트카 차고</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312151A'/%3E%3Cpath d='M32 12l14 18H18z' fill='%23E8ECF1'/%3E%3C/svg%3E">
<style>
/* 차 고르는 첫 화면: 차마다 큰 카드 하나 */
:root{--bg:#12151A;--panel:#1C2128;--line:#2E3540;--text:#E8ECF1;--muted:#8A94A3;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font)}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{width:min(440px,100%);display:flex;flex-direction:column;gap:14px}
h1{margin:0 0 4px;font-size:26px;font-weight:800}
p{margin:0 0 10px;color:var(--muted);font-size:14px;line-height:1.5}
a.car{display:grid;grid-template-columns:6px 1fr auto;gap:16px;align-items:center;text-decoration:none;color:var(--text);
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 20px 20px 0}
a.car:hover,a.car:focus-visible{border-color:var(--c);outline:none}
.bar{align-self:stretch;border-radius:0 4px 4px 0;background:var(--c)}
.name{font-size:22px;font-weight:800}
.id{color:var(--muted);font-size:13px;margin-top:4px;font-family:ui-monospace,Consolas,monospace}
.go{color:var(--c);font-size:24px;font-weight:800}
</style>
</head>
<body>
<main>
  <h1>스마트카</h1>
  <p>조종할 차를 고르세요. 각 차의 리모컨은 따로 열리고, 홈 화면에 따로 추가할 수 있어요.</p>
  <a class="car" href="car1/" style="--c:#F2A93B"><span class="bar"></span><span><span class="name">1호차</span><div class="id">mrs4me46</div></span><span class="go">›</span></a>
  <a class="car" href="car2/" style="--c:#4FB3F6"><span class="bar"></span><span><span class="name">2호차</span><div class="id">cuumdaph</div></span><span class="go">›</span></a>
</main>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>브레드보드 CAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* CAD 작업 화면: 위 제목줄·도구 막대, 왼쪽 라이브러리 독, 가운데 격자 캔버스, 오른쪽 속성·점검·객체 독, 아래 명령줄·상태 표시줄 */
:root{
  --bg:#DADDE2; --chrome:#ECEEF1; --panel:#F7F8FA; --surface:#FFFFFF; --sunk:#E6E9ED; --line:#C9CED6; --line2:#D9DDE3;
  --fg:#1B1F24; --muted:#5D6672; --accent:#1C6FD1; --accent-ink:#FFFFFF; --accent-soft:#DCE9F9;
  --ok:#1D8F53; --warn:#9A6200; --bad:#C2362F;
  --hi:#E5484D; --lo:#3E63DD; --zz:#9AA3AD; --xx:#E08A00; --sh:#C837AB;
  --grid:#CFD3D9; --grid2:#BCC2CA; --cross:#1C6FD1;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,"D2Coding",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171B; --chrome:#1E2227; --panel:#23282E; --surface:#2A3037; --sunk:#1A1E23; --line:#363D46; --line2:#2E343C;
  --fg:#D8DDE3; --muted:#8D97A3; --accent:#3B9EFF; --accent-ink:#04182E; --accent-soft:#1B3550;
  --ok:#3CC97E; --warn:#E3B13F; --bad:#EE6A61; --grid:#1D2126; --grid2:#262B32; --cross:#5FB0FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171B; --chrome:#1E2227; --panel:#23282E; --surface:#2A3037; --sunk:#1A1E23; --line:#363D46; --line2:#2E343C;
  --fg:#D8DDE3; --muted:#8D97A3; --accent:#3B9EFF; --accent-ink:#04182E; --accent-soft:#1B3550;
  --ok:#3CC97E; --warn:#E3B13F; --bad:#EE6A61; --grid:#1D2126; --grid2:#262B32; --cross:#5FB0FF; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--chrome);color:var(--fg);font-family:var(--sans);font-size:13px;line-height:1.45;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;height:100vh;height:100dvh;grid-template-columns:250px minmax(0,1fr) 320px;grid-template-rows:auto auto minmax(0,1fr) auto auto;
  grid-template-areas:"title title title" "tool tool tool" "left canvas right" "cmd cmd cmd" "stat stat stat"}
/* 제목줄 */
.titlebar{grid-area:title;display:flex;align-items:center;gap:10px;padding:5px max(12px,env(safe-area-inset-left,0px));background:var(--chrome);border-bottom:1px solid var(--line)}
.logo{width:22px;height:22px;flex:none;border-radius:5px;background:#F4F1E8;border:1px solid #CFC8B4;display:grid;grid-template-columns:repeat(3,4px);gap:2px;place-content:center}
.logo i{width:4px;height:4px;border-radius:1px;background:#3B3B3B}.logo i:nth-child(5){background:#E5484D}
.titlebar h1{margin:0;font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.titlebar .doc{color:var(--muted);font-family:var(--mono);font-size:12px}
.titlebar .sp{flex:1}
.titlebar a{color:var(--muted);text-decoration:none;font-size:12.5px}
.titlebar a:hover{color:var(--fg)}
/* 도구 막대 */
.toolbar{grid-area:tool;display:flex;align-items:stretch;gap:0;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);padding:3px max(8px,env(safe-area-inset-left,0px))}
.grp{display:flex;align-items:center;gap:2px;padding:0 8px;border-right:1px solid var(--line2);position:relative}
.grp:last-child{border-right:0}
.grp>.gl{position:absolute;left:8px;bottom:-1px;font-size:9px;color:var(--muted);letter-spacing:.06em;display:none}
.tbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:44px;height:42px;padding:2px 6px;border:1px solid transparent;border-radius:5px;background:none;font-size:11px;color:var(--fg);white-space:nowrap}
.tbtn svg{width:18px;height:18px;flex:none}
.tbtn:hover{background:var(--sunk);border-color:var(--line)}
.tbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.tbtn:disabled{opacity:.38;cursor:default;background:none;border-color:transparent}
.tbtn.bad{color:var(--bad)}
.pwr .led{width:12px;height:12px;border-radius:50%;background:var(--zz);margin:3px}
.pwr[aria-pressed="true"] .led{background:#2ECC71;box-shadow:0 0 6px #2ECC71}
.zv{font-family:var(--mono);font-size:11.5px;min-width:44px;text-align:center;color:var(--muted)}
select.ex{height:30px;align-self:center;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:0 6px;font-size:12.5px;max-width:240px}
/* 독 */
.dock{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.dock.left{grid-area:left;border-right:1px solid var(--line)}
.dock.right{grid-area:right;border-left:1px solid var(--line)}
.dhead{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--chrome);border-bottom:1px solid var(--line);flex:none}
.dhead b{color:var(--fg);text-transform:none;letter-spacing:0;font-size:12px}
.search{margin:8px;flex:none;height:28px;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:0 8px;font-size:12.5px;outline:none}
.search:focus{border-color:var(--accent)}
.lib{overflow:auto;min-height:0;flex:1;padding:0 6px 8px}
details.sec{margin-bottom:2px}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:5px 4px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";font-size:10px;transition:transform .1s}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec>summary span{margin-left:auto;font-family:var(--mono);font-weight:500}
.items{display:flex;flex-direction:column;gap:1px}
.it{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid transparent;background:none;border-radius:4px;padding:3px 6px;width:100%;min-width:0}
.it:hover{background:var(--sunk)}
.it[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.it .ic{flex:none;width:30px;height:18px;display:grid;place-items:center}
.it .tx{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.it b{font-weight:600;font-size:12.5px;font-family:var(--mono)}
.it small{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it kbd{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.optbox{flex:none;border-top:1px solid var(--line);max-height:45%;overflow:auto}
.opts{display:flex;flex-direction:column;gap:8px;padding:10px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:22px;height:22px;border-radius:4px;border:2px solid var(--panel);outline:1px solid var(--line);padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:3px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:2px 8px;font-size:12px;font-family:var(--mono)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* 캔버스 */
.canvas{grid-area:canvas;position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
#bb{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;touch-action:none;cursor:crosshair}
#bb.panning{cursor:grabbing}
#bb .c{cursor:move}
#bb.place .c:not(.ia){pointer-events:none}
#bb .c.ia{cursor:pointer}
.navhud{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
.navhud button{width:30px;height:30px;border-radius:5px;border:1px solid var(--line);background:var(--panel);font-size:15px;line-height:1;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.navhud button:hover{border-color:var(--accent)}
.vlabel{position:absolute;left:10px;top:8px;font-family:var(--mono);font-size:11px;color:var(--muted);pointer-events:none;background:color-mix(in srgb,var(--bg) 70%,transparent);padding:1px 6px;border-radius:3px}
/* 오른쪽 탭 */
.tabs{display:flex;background:var(--chrome);border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;border-right:1px solid var(--line2);background:none;padding:7px 6px;font-size:12px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.cnt{font-family:var(--mono);font-size:10.5px;background:var(--sunk);border-radius:8px;padding:0 6px;color:var(--muted)}
.cnt.w{background:var(--warn);color:#fff}.cnt.b{background:var(--bad);color:#fff}
.pane{overflow:auto;min-height:0;flex:1;padding:10px 12px}
.warns{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.warns li{display:grid;grid-template-columns:18px 1fr;gap:6px;font-size:12.5px}
.warns li::before{content:"!";width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--warn);color:#fff;margin-top:1px}
.warns li.bad::before{background:var(--bad)}
.warns li.ok::before{content:"✓";background:var(--ok)}
.olist{display:flex;flex-direction:column}
.orow{display:grid;grid-template-columns:52px 1fr auto 10px;gap:8px;align-items:center;border:0;border-bottom:1px solid var(--line2);background:none;text-align:left;padding:4px 4px;font-size:12px}
.orow:hover{background:var(--sunk)}
.orow[aria-selected="true"]{background:var(--accent-soft)}
.orow .k{font-family:var(--mono);font-weight:600}
.orow .loc{font-family:var(--mono);color:var(--muted);font-size:11px}
.orow .d{width:8px;height:8px;border-radius:50%;background:transparent}
.ttl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.ttl b{font-size:14.5px;font-family:var(--mono)}
.ttl span{color:var(--muted);font-size:12px}
.desc{color:var(--muted);font-size:12.5px;margin:0 0 10px}
table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;padding:3px 4px;border-bottom:1px solid var(--line)}
td{padding:2px 4px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.n{font-family:var(--mono);color:var(--muted);width:26px;text-align:right}
td.p{font-family:var(--mono);font-weight:600}
td.r{color:var(--muted)}
.ov{text-decoration:overline}
.lv{display:inline-block;min-width:20px;text-align:center;font-family:var(--mono);font-size:11px;font-weight:700;border-radius:3px;padding:0 4px;color:#fff}
.lv.H{background:var(--hi)}.lv.L{background:var(--lo)}.lv.Z{background:var(--zz)}.lv.X{background:var(--xx)}.lv.S{background:var(--sh)}
.lv.w{opacity:.75}
.pinouts{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.gates{display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:12px;margin:8px 0}
.gates div{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tt{margin-top:8px}
.tt table{width:auto}
.tt td,.tt th{text-align:center;font-family:var(--mono);padding:2px 10px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:4px 10px;font-size:12.5px}
.btn:hover{border-color:var(--muted)}
.btn.bad{color:var(--bad)}
select.btn{padding-right:4px}
.prop{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.prop label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.help{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.help b{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;gap:4px;align-items:center}
.pane h3{margin:0 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
code{font-family:var(--mono);font-size:11.5px;background:var(--sunk);padding:1px 4px;border-radius:3px}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--surface)}
/* 명령줄 · 상태 표시줄 */
.cmd{grid-area:cmd;display:flex;align-items:center;gap:8px;padding:4px 12px;background:var(--sunk);border-top:1px solid var(--line);font-family:var(--mono);font-size:12px;min-height:26px}
.cmd .p{color:var(--accent);font-weight:600;flex:none}
.cmd #hint{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--sans)}
.cmd #hint b{font-family:var(--mono)}
.statusbar{grid-area:stat;display:flex;align-items:center;background:var(--accent);color:var(--accent-ink);font-size:11.5px;min-height:24px;padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
.statusbar>*{padding:2px 10px;border-right:1px solid color-mix(in srgb,var(--accent-ink) 25%,transparent);white-space:nowrap;display:flex;align-items:center;gap:5px}
.statusbar>*:last-child{border-right:0}
.statusbar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.statusbar .mono{font-family:var(--mono)}
.statusbar .lv{border:1px solid rgba(255,255,255,.5)}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--fg);color:var(--chrome);padding:7px 14px;border-radius:6px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);z-index:9}
.toast.on{opacity:.95}
/* 좁은 화면: 위아래로 쌓고 페이지 스크롤 */
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 50vh auto auto auto auto;grid-template-areas:"title" "tool" "canvas" "cmd" "left" "right" "stat"}
  .dock.left,.dock.right{border:0;border-top:1px solid var(--line)}
  .lib{max-height:320px}.pane{max-height:none}
  .tbtn{min-width:38px;font-size:10.5px}.grp{padding:0 4px}
  .titlebar .doc{display:none}
  .statusbar .hide-s{display:none}
}
/* SVG 안쪽 */
.bbody{fill:#F5F2EA;stroke:#D8D1BF}
.groove{fill:#E6E0D0}
.hole{fill:#3A3A38}
.rl{font:600 9px var(--mono);fill:#8A836F}
.rlab{font:700 13px var(--mono)}
.gmin{stroke:var(--grid);stroke-width:1}
.gmaj{stroke:var(--grid2);stroke-width:1}
.hl{fill:none;stroke:#18A06F;stroke-width:2}
.hl.cur{stroke:#0B6B49;stroke-width:2.6}
.ghost{fill:color-mix(in srgb,#18A06F 18%,transparent);stroke:#18A06F;stroke-width:1.5;stroke-dasharray:4 3}
.ghost.bad{fill:color-mix(in srgb,#C2362F 15%,transparent);stroke:#C2362F}
#gO,#gH{pointer-events:none}
.cross{stroke:var(--cross);stroke-width:.8;stroke-dasharray:6 4;opacity:.55;vector-effect:non-scaling-stroke}
.selbox{fill:none;stroke:#1F8FFF;stroke-width:1.6;stroke-dasharray:4 3}
@keyframes bl{50%{opacity:.25}}.blink{animation:bl .6s steps(2) infinite}
</style>
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <h1>브레드보드 CAD</h1>
    <span class="doc" id="docName">— 회로 편집기 · 디지털 논리 시뮬레이션</span>
    <span class="sp"></span>
    <button class="btn" id="theme" title="밝은 화면 / 어두운 화면">테마</button>
    <a href="../">처음 화면</a>
  </header>

  <nav class="toolbar" aria-label="도구 막대">
    <div class="grp">
      <button class="tbtn bad" id="clr" title="새로 만들기 (모두 지우기)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M12 11v6M9 14h6"/></svg>새로</button>
      <button class="tbtn" id="imp" title="파일 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h6l2 2h10v10H3z"/></svg>열기</button>
      <button class="tbtn" id="exp" title="파일로 저장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3h12l3 3v15H5z"/><path d="M8 3v5h8V3M8 21v-7h9v7"/></svg>저장</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
    <div class="grp">
      <button class="tbtn" id="undo" title="실행 취소 (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 7L4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-3"/></svg>취소</button>
      <button class="tbtn" id="redo" title="다시 실행 (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 7l5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h3"/></svg>다시</button>
      <button class="tbtn" id="delb" title="선택한 부품 삭제 (Delete)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg>삭제</button>
    </div>
    <div class="grp">
      <button class="tbtn" data-tool="select" title="선택·이동 (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z" fill="currentColor"/></svg>선택</button>
      <button class="tbtn" data-tool="wire" title="전선 (W)"><svg viewBox="0 0 24 24" fill="none" stroke="#D93A3A" stroke-width="2.4" stroke-linecap="round"><path d="M4 18Q12 2 20 18"/></svg>전선</button>
    </div>
    <div class="grp">
      <button class="tbtn" id="zo" title="축소 (−)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="6"/><path d="M15 15l5 5M7 10h6"/></svg>축소</button>
      <span class="zv" id="zv">100%</span>
      <button class="tbtn" id="zi" title="확대 (+)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="6"/><path d="M15 15l5 5M7 10h6M10 7v6"/></svg>확대</button>
      <button class="tbtn" id="fit" title="화면에 맞춤 (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><rect x="8" y="8" width="8" height="8"/></svg>맞춤</button>
      <button class="tbtn" id="sig" aria-pressed="false" title="신호 색 보기: HIGH 빨강 · LOW 파랑"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M2 16h5V8h5v8" stroke="#E5484D"/><path d="M12 16h5V8h5" stroke="#3E63DD"/></svg>신호</button>
    </div>
    <div class="grp">
      <button class="tbtn pwr" id="pwr" aria-pressed="true" title="전원 켜기/끄기"><span class="led"></span><span id="pwrTx">전원 ON</span></button>

<script>
'use strict';
/* ───────── 보드 기하 ───────── */
const N=50, P=20, X0=36, W=X0*2+(N-1)*P, H=384;
const ROWS=['tn','tp','a','b','c','d','e','f','g','h','i','j','bn','bp'];
const ROWY={tn:28,tp:48,a:90,b:110,c:130,d:150,e:170,f:214,g:234,h:254,i:274,j:294,bn:336,bp:356};
const MID=192;
const colX=c=>X0+(c-1)*P;
const isRail=r=>r.length===2;
const railHas=c=>(c-1)%6!==5;
const HOLES=new Map(), HL=[];
for(const r of ROWS)for(let c=1;c<=N;c++){
  if(isRail(r)&&!railHas(c))continue;
  const h={id:r+c,r,c,ri:ROWS.indexOf(r),x:colX(c),y:ROWY[r],i:HL.length};HOLES.set(h.id,h);HL.push(h);
}
const baseKey=h=>isRail(h.r)?h.r:(h.ri<=6?'T':'B')+h.c;
const baseRep=(()=>{const m=new Map();return HL.map(h=>{const k=baseKey(h);if(!m.has(k))m.set(k,h.i);return m.get(k);});})();
const RAIL={tn:HOLES.get('tn1').i,tp:HOLES.get('tp1').i,bn:HOLES.get('bn1').i,bp:HOLES.get('bp1').i};
const holeAt=(ri,c)=>ri>=0&&ri<ROWS.length?HOLES.get(ROWS[ri]+c):undefined;
function holeName(id){const h=HOLES.get(id);if(!h)return id;
  if(isRail(h.r))return (h.r[0]==='t'?'위쪽 ':'아래쪽 ')+(h.r[1]==='p'?'+':'−')+' 레일 '+h.c;
  return h.r+h.c;}

/* ───────── 논리값 ───────── */
const L=0,Hh=1,X=2,Z=3,SH=4;
const NOT=a=>a===X?X:1-a;
const AND=(a,b)=>a===L||b===L?L:(a===Hh&&b===Hh?Hh:X);
const OR=(a,b)=>a===Hh||b===Hh?Hh:(a===L&&b===L?L:X);
const XOR=(a,b)=>a===X||b===X?X:a^b;
const anyX=a=>a.some(v=>v===X);
const toNum=a=>a.reduce((s,v,i)=>s|(v<<i),0);
const LVK=['L','H','X','Z','S'];

/* ───────── IC 정의 ───────── */
const CHIPS={};
function def(d){d.idx={};d.pins.forEach((p,i)=>d.idx[p]=i);d.vcc=d.vcc||'VCC';d.gnd=d.gnd||'GND';d.outs=new Set(d.outs);d.roles=d.roles||{};CHIPS[d.name]=d;}
const STD=['1A','1B','1Y','2A','2B','2Y','GND','3Y','3A','3B','4Y','4A','4B','VCC'];
const NORP=['1Y','1A','1B','2Y','2A','2B','GND','3A','3B','3Y','4A','4B','4Y','VCC'];
const INV=['1A','1Y','2A','2Y','3A','3Y','GND','4Y','4A','5Y','5A','6Y','6A','VCC'];
function gate2(name,title,kind,fn,pins,expr){def({name,title,kind,expr,pins,fn,outs:[1,2,3,4].map(n=>n+'Y'),
  gates:[1,2,3,4].map(n=>({ins:[n+'A',n+'B'],out:n+'Y'})),
  desc:`2입력 ${kind} 게이트가 4개 들어 있어요. 게이트마다 입력 A·B, 출력 Y (Y = ${expr}).`,
  eval(g){const o={};for(const t of this.gates)o[t.out]=fn(g(t.ins[0]),g(t.ins[1]));return o;}});}
gate2('74HC00','NAND 게이트 ×4','NAND',(a,b)=>NOT(AND(a,b)),STD,'NOT(A·B)');
gate2('74HC02','NOR 게이트 ×4','NOR',(a,b)=>NOT(OR(a,b)),NORP,'NOT(A+B)');
def({name:'74HC04',title:'NOT 게이트 ×6',kind:'NOT',pins:INV,fn:NOT,outs:[1,2,3,4,5,6].map(n=>n+'Y'),
  gates:[1,2,3,4,5,6].map(n=>({ins:[n+'A'],out:n+'Y'})),desc:'인버터(NOT 게이트)가 6개 들어 있어요. 입력 A를 뒤집어 Y로 내보내요.',
  eval(g){const o={};for(const t of this.gates)o[t.out]=NOT(g(t.ins[0]));return o;}});
gate2('74HC08','AND 게이트 ×4','AND',AND,STD,'A·B');
gate2('74HC32','OR 게이트 ×4','OR',OR,STD,'A+B');
gate2('74HC86','XOR 게이트 ×4','XOR',XOR,STD,'A⊕B');
def({name:'74HC74',title:'D 플립플롭 ×2',pins:['~1CLR','1D','1CLK','~1PRE','1Q','~1Q','GND','~2Q','2Q','~2PRE','2CLK','2D','~2CLR','VCC'],
  outs:['1Q','~1Q','2Q','~2Q'],
  desc:'클럭(CLK)이 LOW→HIGH로 바뀌는 순간 D 값을 Q에 저장해요. CLR(초기화)과 PRE(설정)는 LOW일 때 동작하니 쓰지 않으면 + 에 연결하세요.',
  roles:{'~1CLR':'초기화 (LOW면 Q=0)','1D':'데이터 입력','1CLK':'클럭 (상승 에지)','~1PRE':'설정 (LOW면 Q=1)','1Q':'출력','~1Q':'반전 출력',
         '~2CLR':'초기화 (LOW면 Q=0)','2D':'데이터 입력','2CLK':'클럭 (상승 에지)','~2PRE':'설정 (LOW면 Q=1)','2Q':'출력','~2Q':'반전 출력'},
  init:()=>({q1:L,q2:L,p1:X,p2:X}),
  eval(g,st){const o={};for(const n of [1,2]){
    const clr=g('~'+n+'CLR'),pre=g('~'+n+'PRE'),clk=g(n+'CLK'),d=g(n+'D');let q=st['q'+n];
    const rise=st['p'+n]===L&&clk===Hh;st['p'+n]=clk;
    if(clr===L&&pre===L){o[n+'Q']=Hh;o['~'+n+'Q']=Hh;continue;}
    if(clr===L)q=L;else if(pre===L)q=Hh;else if(clr===X||pre===X)q=X;else if(rise)q=d;
    st['q'+n]=q;o[n+'Q']=q;o['~'+n+'Q']=NOT(q);}
    return o;}});
def({name:'74HC161',title:'4비트 2진 카운터',pins:['~CLR','CLK','A','B','C','D','ENP','GND','~LOAD','ENT','QD','QC','QB','QA','RCO','VCC'],
  outs:['QA','QB','QC','QD','RCO'],
  desc:'클럭이 올라갈 때마다 QD QC QB QA 가 0000→0001→…→1111 로 1씩 늘어요. ENP·ENT·LOAD·CLR은 + 에 연결해야 세기 시작해요.',
  roles:{'~CLR':'초기화 (LOW면 0000)','CLK':'클럭 (상승 에지)','A':'불러올 값 비트0','B':'불러올 값 비트1','C':'불러올 값 비트2','D':'불러올 값 비트3',
         'ENP':'세기 허용','ENT':'세기 허용·RCO 허용','~LOAD':'불러오기 (LOW면 DCBA를 저장)','QA':'출력 비트0 (1)','QB':'출력 비트1 (2)','QC':'출력 비트2 (4)','QD':'출력 비트3 (8)','RCO':'1111일 때 HIGH (자리올림)'},
  init:()=>({n:0,p:X}),
  eval(g,st){const clk=g('CLK'),rise=st.p===L&&clk===Hh;st.p=clk;const clr=g('~CLR'),ent=g('ENT');
    if(clr===L)st.n=0;else if(clr===X)st.n=-1;
    else if(rise){const ld=g('~LOAD');
      if(ld===L){const d=['A','B','C','D'].map(g);st.n=anyX(d)?-1:toNum(d);}
      else if(ld===X)st.n=-1;
      else{const en=AND(g('ENP'),ent);if(en===Hh)st.n=st.n<0?-1:(st.n+1)&15;else if(en===X)st.n=-1;}}
    const b=k=>st.n<0?X:(st.n>>k)&1;
    return{QA:b(0),QB:b(1),QC:b(2),QD:b(3),RCO:AND(ent,st.n<0?X:(st.n===15?Hh:L))};}});
def({name:'74HC138',title:'3→8 디코더',pins:['A','B','C','~G2A','~G2B','G1','~Y7','GND','~Y6','~Y5','~Y4','~Y3','~Y2','~Y1','~Y0','VCC'],
  outs:['~Y0','~Y1','~Y2','~Y3','~Y4','~Y5','~Y6','~Y7'],
  desc:'입력 C B A 가 나타내는 번호(0~7)의 출력 하나만 LOW가 되고 나머지는 HIGH예요. G1=HIGH, G2A·G2B=LOW 일 때만 동작해요.',
  roles:{A:'선택 비트0',B:'선택 비트1',C:'선택 비트2',G1:'허용 (HIGH)','~G2A':'허용 (LOW)','~G2B':'허용 (LOW)'},
  eval(g){const o={},en=AND(g('G1'),AND(NOT(g('~G2A')),NOT(g('~G2B')))),s=['A','B','C'].map(g);
    for(let k=0;k<8;k++){o['~Y'+k]=en===L?Hh:(en===X||anyX(s))?X:(toNum(s)===k?L:Hh);}return o;}});
def({name:'74HC283',title:'4비트 가산기',pins:['S2','B2','A2','S1','A1','B1','C0','GND','C4','S4','B4','A4','S3','A3','B3','VCC'],
  outs:['S1','S2','S3','S4','C4'],
  desc:'A4A3A2A1 + B4B3B2B1 + C0(올림 입력)을 더해 S4S3S2S1 과 C4(올림 출력)로 내보내요. 1이 가장 낮은 자리예요.',
  roles:{C0:'올림 입력',C4:'올림 출력'},
  eval(g){const a=['A1','A2','A3','A4'].map(g),b=['B1','B2','B3','B4'].map(g),c=g('C0');const o={};
    if(anyX(a)||anyX(b)||c===X){for(const k of this.outs)o[k]=X;return o;}
    const s=toNum(a)+toNum(b)+c;for(let k=0;k<4;k++)o['S'+(k+1)]=(s>>k)&1;o.C4=(s>>4)&1;return o;}});
const SEG={0:'1111110',1:'0110000',2:'1101101',3:'1111001',4:'0110011',5:'1011011',6:'0011111',7:'1110000',8:'1111111',9:'1110011'};
def({name:'CD4511',title:'BCD→7세그먼트 디코더',pins:['B','C','~LT','~BI','LE','D','A','VSS','e','d','c','b','a','g','f','VDD'],vcc:'VDD',gnd:'VSS',
  outs:['a','b','c','d','e','f','g'],
  desc:'4비트 숫자(D C B A = 0~9)를 받아 7세그먼트의 a~g 를 켜요(공통 캐소드용). LT·BI 는 + 에, LE 는 − 에 연결하면 바로 표시돼요. 10 이상은 꺼져요.',
  roles:{A:'숫자 비트0 (1)',B:'숫자 비트1 (2)',C:'숫자 비트2 (4)',D:'숫자 비트3 (8)','~LT':'전체 점등 시험 (LOW면 8)','~BI':'끄기 (LOW면 모두 꺼짐)',LE:'값 고정 (HIGH면 유지)',VDD:'전원 +',VSS:'전원 −'},
  init:()=>({v:0}),
  eval(g,st){const le=g('LE');if(le===L){const d=['A','B','C','D'].map(g);st.v=anyX(d)?-1:toNum(d);}else if(le===X)st.v=-1;
    const lt=g('~LT'),bi=g('~BI'),o={};const set=f=>'abcdefg'.split('').forEach((s,i)=>o[s]=f(i));
    if(lt===L)set(()=>Hh);else if(lt===X||bi===X)set(()=>X);else if(bi===L)set(()=>L);
    else if(st.v<0)set(()=>X);else if(st.v>9)set(()=>L);else set(i=>+SEG[st.v][i]);return o;}});
const SEG47={0:'1111110',1:'0110000',2:'1101101',3:'1111001',4:'0110011',5:'1011011',6:'0011111',7:'1110000',8:'1111111',9:'1110011',
  10:'0001101',11:'0011001',12:'0100011',13:'1001011',14:'0001111',15:'0000000'};
function ls47(name,vmax){def({name,title:'BCD→7세그먼트 디코더 (오픈 컬렉터, '+vmax+')',ttl:true,
  pins:['B','C','~LT','~BI','~RBI','D','A','GND','~e','~d','~c','~b','~a','~g','~f','VCC'],
  outs:['~a','~b','~c','~d','~e','~f','~g'],
  desc:`4비트 숫자(D C B A)를 받아 켤 획의 출력을 LOW로 끌어내려요(오픈 컬렉터, 켜지 않는 획은 연결 끊김). 그래서 공통 애노드 7세그먼트와 함께 써요 — COM은 + 에, 각 획은 저항을 거쳐 연결하세요. TTL(74LS)이라 떠 있는 입력은 HIGH로 읽혀요. 10~15는 특수 모양이 나오고 15는 꺼져요.${name==='74LS46'?' 74LS47과 핀·동작이 같고 출력 내전압만 30V로 더 높아요.':' 출력 내전압 15V.'}`,
  roles:{A:'숫자 비트0 (1)',B:'숫자 비트1 (2)',C:'숫자 비트2 (4)',D:'숫자 비트3 (8)','~LT':'전체 점등 시험 (LOW면 8)','~BI':'끄기 (LOW면 모두 꺼짐)','~RBI':'0 지우기 (LOW이고 입력이 0이면 꺼짐)',
    '~a':'획 a (켜면 LOW)','~b':'획 b (켜면 LOW)','~c':'획 c (켜면 LOW)','~d':'획 d (켜면 LOW)','~e':'획 e (켜면 LOW)','~f':'획 f (켜면 LOW)','~g':'획 g (켜면 LOW)'},
  eval(g){const o={},set=f=>'abcdefg'.split('').forEach((s,i)=>o['~'+s]=f(i));
    const bi=g('~BI'),lt=g('~LT'),d=['A','B','C','D'].map(g),rbi=g('~RBI');
    if(bi===L)set(()=>Z);else if(bi===X)set(()=>X);else if(lt===L)set(()=>L);else if(lt===X||anyX(d))set(()=>X);
    else{const v=toNum(d);if(v===0&&rbi===L)set(()=>Z);else set(i=>SEG47[v][i]==='1'?L:Z);}
    return o;}});}
ls47('74LS47','15V');ls47('74LS46','30V');

/* ───────── 74LS 시리즈 ───────── */
const TTLN=' TTL(74LS)이라 아무 데도 연결하지 않은 입력은 HIGH로 읽혀요.';
const NCR={NC:'연결 없음 (NC)'};
function lsClone(hc,ls,extra){const h=CHIPS[hc];def(Object.assign({},h,{name:ls,ttl:true,outs:[...h.outs],roles:Object.assign({},h.roles),desc:h.desc+TTLN},extra||{}));}
['00','02','04','08','32','86','74','138','161','283'].forEach(n=>lsClone('74HC'+n,'74LS'+n));
lsClone('74HC04','74LS14',{title:'NOT 게이트 ×6 (슈미트 트리거)',desc:'슈미트 트리거 입력 인버터 6개. 논리 동작은 NOT과 같고, 실제 칩은 느리게 변하거나 잡음 섞인 신호를 깨끗하게 바꿔 줘요.'+TTLN});
const ANDn=a=>a.reduce(AND),ORn=a=>a.reduce(OR);
function gateN(name,title,kind,red,expr,pins,groups){def({name,title,kind,expr,pins,ttl:true,roles:NCR,fn:(...a)=>red(a),outs:groups.map(g=>g[1]),
  gates:groups.map(([ins,out])=>({ins,out})),desc:`${groups[0][0].length}입력 ${kind} 게이트가 ${groups.length}개 들어 있어요. Y = ${expr}.`+TTLN,
  eval(g){const o={};for(const t of this.gates)o[t.out]=red(t.ins.map(g));return o;}});}
const P3=['1A','1B','2A','2B','2C','2Y','GND','3Y','3A','3B','3C','1Y','1C','VCC'],G3=[[['1A','1B','1C'],'1Y'],[['2A','2B','2C'],'2Y'],[['3A','3B','3C'],'3Y']];
const P4=['1A','1B','NC','1C','1D','1Y','GND','2Y','2A','2B','NC','2C','2D','VCC'],G4=[[['1A','1B','1C','1D'],'1Y'],[['2A','2B','2C','2D'],'2Y']];
gateN('74LS10','3입력 NAND ×3','NAND',a=>NOT(ANDn(a)),'NOT(A·B·C)',P3,G3);
gateN('74LS11','3입력 AND ×3','AND',ANDn,'A·B·C',P3,G3);
gateN('74LS27','3입력 NOR ×3','NOR',a=>NOT(ORn(a)),'NOT(A+B+C)',P3,G3);

def({name:'74LS125',title:'3상태 버퍼 ×4',ttl:true,pins:['~1C','1A','1Y','~2C','2A','2Y','GND','3Y','3A','~3C','4Y','4A','~4C','VCC'],outs:['1Y','2Y','3Y','4Y'],

def({name:'74LS75',title:'4비트 D 래치',ttl:true,pins:['~1Q','1D','2D','C34','VCC','3D','4D','~4Q','4Q','3Q','~3Q','GND','C12','~2Q','2Q','1Q'],

def({name:'74LS112',title:'JK 플립플롭 ×2 (하강 에지)',ttl:true,pins:['1CLK','1K','1J','~1PRE','1Q','~1Q','~2Q','GND','2Q','~2PRE','2J','2K','2CLK','~2CLR','~1CLR','VCC'],
  outs:['1Q','~1Q','2Q','~2Q'],
  desc:'클럭이 HIGH→LOW로 떨어지는 순간 J·K에 따라 동작해요: 00 유지, 01 리셋(Q=0), 10 세트(Q=1), 11 반전(토글). PRE̅·CLR̅는 LOW일 때 바로 동작해요.'+TTLN,
  roles:{'1CLK':'클럭 (하강 에지)','2CLK':'클럭 (하강 에지)','~1PRE':'설정 (LOW면 Q=1)','~2PRE':'설정 (LOW면 Q=1)','~1CLR':'초기화 (LOW면 Q=0)','~2CLR':'초기화 (LOW면 Q=0)'},
  init:()=>({q1:L,q2:L,p1:X,p2:X}),
  eval(g,st){const o={};for(const n of [1,2]){const clr=g('~'+n+'CLR'),pre=g('~'+n+'PRE'),clk=g(n+'CLK'),j=g(n+'J'),k=g(n+'K');let q=st['q'+n];
    const fall=st['p'+n]===Hh&&clk===L;st['p'+n]=clk;
    if(clr===L&&pre===L){o[n+'Q']=Hh;o['~'+n+'Q']=Hh;continue;}
    if(clr===L)q=L;else if(pre===L)q=Hh;else if(clr===X||pre===X)q=X;
    else if(fall){if(j===X||k===X)q=X;else if(j&&k)q=NOT(q);else if(j)q=Hh;else if(k)q=L;}
    st['q'+n]=q;o[n+'Q']=q;o['~'+n+'Q']=NOT(q);}return o;}});
def({name:'74LS76',title:'JK 플립플롭 ×2 (프리셋·클리어, 하강 에지)',ttl:true,

def({name:'74LS164',title:'8비트 직렬입력·병렬출력 시프트 레지스터',ttl:true,pins:['A','B','QA','QB','QC','QD','GND','CLK','~CLR','QE','QF','QG','QH','VCC'],

  desc:'클럭이 올라갈 때마다 QA→QB→…→QH 로 한 칸씩 밀리고, QA에는 A·B(둘 다 HIGH면 1)가 들어가요. CLR̅가 LOW면 모두 0.'+TTLN,
  roles:{A:'직렬 데이터 입력',B:'직렬 데이터 입력 (A와 AND)',CLK:'클럭 (상승 에지)','~CLR':'초기화 (LOW면 0)'},init:()=>({q:Array(8).fill(L),p:X}),

def({name:'74LS175',title:'D 플립플롭 ×4 (공통 클럭)',ttl:true,pins:['~CLR','1Q','~1Q','1D','2D','~2Q','2Q','GND','CLK','3Q','~3Q','3D','4D','~4Q','4Q','VCC'],

function ripple(name,title,mod,pins,desc){def({name,title,ttl:true,pins,outs:['QA','QB','QC','QD'],desc:desc+TTLN,
  roles:Object.assign({CKA:'클럭 A (하강 에지) → QA',CKB:'클럭 B (하강 에지) → QB·QC·QD',R01:'0으로 리셋 (R01·R02 둘 다 HIGH)',R02:'0으로 리셋 (R01·R02 둘 다 HIGH)',R91:'9로 설정 (R91·R92 둘 다 HIGH)',R92:'9로 설정 (R91·R92 둘 다 HIGH)'},NCR),
  init:()=>({a:0,b:0,pa:X,pb:X,x:false}),
  eval(g,st){const ca=g('CKA'),cb=g('CKB');const fa=st.pa===Hh&&ca===L,fb=st.pb===Hh&&cb===L;st.pa=ca;st.pb=cb;
    const r0=AND(g('R01'),g('R02')),r9=mod===5?AND(g('R91'),g('R92')):L;
    if(r9===Hh){st.a=1;st.b=4;st.x=false;}else if(r0===Hh){st.a=0;st.b=0;st.x=false;}else if(r0===X||r9===X)st.x=true;
    else{if(fa)st.a^=1;if(fb)st.b=(st.b+1)%mod;}
    if(st.x)return{QA:X,QB:X,QC:X,QD:X};return{QA:st.a,QB:st.b&1,QC:(st.b>>1)&1,QD:(st.b>>2)&1};}});}

function updown(name,title,mod){def({name,title,ttl:true,pins:['B','QB','QA','DOWN','UP','QC','QD','GND','D','C','~LOAD','~CO','~BO','CLR','A','VCC'],
  outs:['QA','QB','QC','QD','~CO','~BO'],
  desc:`UP에 클럭을 넣으면 1씩 늘고(DOWN은 HIGH 유지), DOWN에 넣으면 1씩 줄어요(0~${mod-1}). CLR은 HIGH일 때 0으로 만들기 때문에 − 에 연결해야 세기 시작해요. LOAD̅가 LOW면 DCBA를 바로 불러와요.`+TTLN,
  roles:{UP:'올려 세기 클럭 (상승 에지)',DOWN:'내려 세기 클럭 (상승 에지)',CLR:'초기화 (HIGH면 0)','~LOAD':'불러오기 (LOW면 DCBA)','~CO':`자리올림 (${mod-1}에서 UP이 LOW일 때 LOW)`,'~BO':'자리빌림 (0에서 DOWN이 LOW일 때 LOW)',A:'불러올 값 비트0',B:'불러올 값 비트1',C:'불러올 값 비트2',D:'불러올 값 비트3'},
  init:()=>({n:0,pu:X,pd:X}),
  eval(g,st){const up=g('UP'),dn=g('DOWN'),ru=st.pu===L&&up===Hh,rd=st.pd===L&&dn===Hh;st.pu=up;st.pd=dn;const clr=g('CLR'),ld=g('~LOAD');
    if(clr===Hh)st.n=0;else if(clr===X)st.n=-1;else if(ld===L){const d=['A','B','C','D'].map(g);st.n=anyX(d)?-1:toNum(d)%16;}else if(ld===X)st.n=-1;
    else if(st.n>=0){if(ru&&dn===Hh)st.n=(st.n+1)%mod;else if(rd&&up===Hh)st.n=(st.n-1+mod)%mod;}
    const b=k=>st.n<0?X:(st.n>>k)&1;
    return{QA:b(0),QB:b(1),QC:b(2),QD:b(3),'~CO':st.n<0?X:(st.n===mod-1&&up===L)?L:Hh,'~BO':st.n<0?X:(st.n===0&&dn===L)?L:Hh};}});}

def({name:'74LS151',title:'8→1 멀티플렉서',ttl:true,pins:['D3','D2','D1','D0','Y','W','~G','GND','C','B','A','D7','D6','D5','D4','VCC'],outs:['Y','W'],

def({name:'74LS153',title:'4→1 멀티플렉서 ×2',ttl:true,pins:['~1G','B','1C3','1C2','1C1','1C0','1Y','GND','2Y','2C0','2C1','2C2','2C3','A','~2G','VCC'],outs:['1Y','2Y'],

def({name:'74LS157',title:'2→1 멀티플렉서 ×4',ttl:true,pins:['S','1A','1B','1Y','2A','2B','2Y','GND','3Y','3B','3A','4Y','4B','4A','~G','VCC'],outs:['1Y','2Y','3Y','4Y'],

def({name:'74LS85',title:'4비트 크기 비교기',ttl:true,pins:['B3','A<Bi','A=Bi','A>Bi','A>B','A=B','A<B','GND','B0','A0','B1','A1','A2','B2','A3','VCC'],outs:['A>B','A=B','A<B'],
  desc:'A3A2A1A0 과 B3B2B1B0 을 비교해 A>B, A=B, A<B 중 하나를 HIGH로 내보내요. 한 개만 쓸 때는 A=B 입력(3번)을 HIGH, A>B·A<B 입력은 LOW로 두세요(여러 개를 이어 붙일 때 쓰는 단).'+TTLN,

  eval(g){const a=['A0','A1','A2','A3'].map(g),b=['B0','B1','B2','B3'].map(g),ig=g('A>Bi'),ie=g('A=Bi'),il=g('A<Bi');

    if(ie===Hh)return{'A>B':L,'A=B':Hh,'A<B':L};if(ie===X)return{'A>B':X,'A=B':X,'A<B':X};return{'A>B':NOT(il),'A=B':L,'A<B':NOT(ig)};}});
def({name:'74LS48',title:'BCD→7세그먼트 디코더 (공통 캐소드용)',ttl:true,pins:['B','C','~LT','~BI','~RBI','D','A','GND','e','d','c','b','a','g','f','VCC'],

  eval(g){const o={},set=f=>'abcdefg'.split('').forEach((s,i)=>o[s]=f(i));const bi=g('~BI'),lt=g('~LT'),d=['A','B','C','D'].map(g),rbi=g('~RBI');

    else{const v=toNum(d);if(v===0&&rbi===L)set(()=>L);else set(i=>SEG47[v][i]==='1'?Hh:L);}return o;}});
def({name:'NE555',title:'타이머 (비안정·단안정)',ttl:true,is555:true,pins:['GND','TRIG','OUT','~RESET','CTRL','THRES','DISCH','VCC'],outs:['OUT','DISCH'],
  desc:'TRIG(2번)이 VCC의 1/3보다 낮아지면 OUT=HIGH, THRES(6번)가 2/3보다 높아지면 OUT=LOW가 되고 DISCH(7번)가 GND로 이어져 커패시터를 방전해요. 비안정(깜박이): VCC–R1–7번–R2–6·2번–C–GND, 주기 ≈ 0.693·(R1+2·R2)·C. 단안정: 펄스 폭 ≈ 1.1·R·C. RESET̅(4번)은 + 에 연결하세요.',
  roles:{TRIG:'트리거 (< ⅓VCC면 OUT=H)',OUT:'출력',
    '~RESET':'리셋 (LOW면 OUT=L)',CTRL:'제어 전압 (보통 0.01µF로 GND, 비워도 됨)',THRES:'문턱 (> ⅔VCC면 OUT=L)',DISCH:'방전 (OUT=L일 때 GND로 연결)'},
  init:()=>({q:L}),
  eval(g,st,va){const rs=g('~RESET'),vc=va?va('CTRL'):null,vth=vc==null?10/3:vc,vtr=vth/2,tr=va?va('TRIG'):null,th=va?va('THRES'):null;
    if(rs===L)st.q=L;else if(tr!=null&&tr<vtr)st.q=Hh;else if(th!=null&&th>vth)st.q=L;

function occ(except){const m=new Map();for(const c of S.comps){if(c.id===except)continue;for(const h of pinHoles(c))m.set(h,c.id);}return m;}

let SIM={netOf:null,lvl:new Map(),weak:new Set(),unstable:false,warns:[],led:new Map(),seg:new Map()};
function makeUF(n){const p=new Int32Array(n);for(let i=0;i<n;i++)p[i]=i;
  const f=x=>{while(p[x]!==x){p[x]=p[p[x]];x=p[x];}return x;};return{f,u(a,b){a=f(a);b=f(b);if(a!==b)p[a]=b;}};}
const clkVal=(c,now)=>Math.floor(now*c.hz*2+1e-9)%2;
function settle(){
  LBL=labels();
  const n=HL.length,uf=makeUF(n),now=performance.now()/1000;
  for(let i=0;i<n;i++)uf.u(i,baseRep[i]);
  const ph=new Map();
  for(const c of S.comps){const hs=pinHoles(c).map(id=>HOLES.get(id).i);ph.set(c.id,hs);
    if(c.t==='wire'||(c.t==='sw'&&c.on)||(c.t==='btn'&&rt(c).pressed))uf.u(hs[0],hs[1]);}
  const netOf=new Int32Array(n);for(let i=0;i<n;i++)netOf[i]=uf.f(i);
  const res=S.comps.filter(c=>c.t==='res').map(c=>[netOf[ph.get(c.id)[0]],netOf[ph.get(c.id)[1]]]);
  const ics=S.comps.filter(c=>c.t==='ic'||c.t==='gate'),clks=S.comps.filter(c=>c.t==='clk');
  let lvl,weak,strong=new Map(),volt=new Map();
  const combine=m=>(m&1)&&(m&2)?SH:(m&4)?X:(m&2)?Hh:L;
  function resolve(){
    const m=new Map(),add=(net,v)=>m.set(net,(m.get(net)||0)|(1<<v));
    if(S.power){add(netOf[RAIL.tp],Hh);add(netOf[RAIL.bp],Hh);add(netOf[RAIL.tn],L);add(netOf[RAIL.bn],L);
      for(const c of clks)add(netOf[ph.get(c.id)[0]],clkVal(c,now));}
    for(const c of ics){const o=rt(c).out;if(!o)continue;const hs=ph.get(c.id);
      for(let k=0;k<o.length;k++)if(o[k]!==Z)add(netOf[hs[k]],o[k]);}
    lvl=new Map();for(const [net,mk] of m)lvl.set(net,combine(mk));strong=new Map(lvl);
    weak=new Set();const wm=new Map();let ch=true,guard=0;
    while(ch&&guard++<60){ch=false;
      for(const [a,b] of res)for(const [u,v] of [[a,b],[b,a]]){
        if(u===v)continue;if(lvl.has(v)&&!weak.has(v))continue;
        let s=lvl.get(u);if(s===undefined)continue;if(s===SH)s=X;
        const pv=wm.get(v)||0,nm=pv|(1<<s);
        if(nm!==pv){wm.set(v,nm);ch=true;lvl.set(v,combine(nm)===SH?X:combine(nm));weak.add(v);}}}
    for(const [net,v] of volt)if(!strong.has(net)){lvl.set(net,v>=2.5?Hh:L);weak.add(net);}
  }
  const vOf=net=>{if(volt.has(net))return volt.get(net);const v=lvl.get(net);return v===Hh?5:v===L?0:null;};
  /* 아날로그(RC) 계산: 커패시터가 닿은 줄들의 전압을 후진 오일러로 적분. 555의 비교기·방전 트랜지스터도 여기서 갱신 */
  function analogStep(){
    const caps=S.comps.filter(c=>c.t==='cap');volt=new Map();
    const dtT=Math.min(.05,Math.max(1e-6,now-(SIM.lastA||now)));SIM.lastA=now;
    if(!caps.length||!S.power){for(const c of caps)rt(c).v=0;return;}
    const t555=ics.filter(c=>c.t==='ic'&&CHIPS[c.chip].is555&&rt(c).pw&&rt(c).st);
    const pn=(c,k)=>netOf[ph.get(c.id)[CHIPS[c.chip].idx[k]]];
    const Rl=S.comps.filter(c=>c.t==='res').map(c=>[netOf[ph.get(c.id)[0]],netOf[ph.get(c.id)[1]],1/c.ohms]);
    for(const c of t555)Rl.push([pn(c,'VCC'),pn(c,'CTRL'),1/5000],[pn(c,'CTRL'),pn(c,'GND'),1/10000]);
    const Cl=caps.map(c=>({r:rt(c),a:netOf[ph.get(c.id)[0]],b:netOf[ph.get(c.id)[1]],C:c.farad}));
    const disch=new Map();for(const c of t555)disch.set(pn(c,'DISCH'),c);
    const adj=new Map(),link=(a,b)=>{if(!adj.has(a))adj.set(a,[]);adj.get(a).push(b);};
    for(const [a,b] of Rl){link(a,b);link(b,a);}for(const e of Cl){link(e.a,e.b);link(e.b,e.a);}
    const steps=Math.max(1,Math.min(80,Math.ceil(dtT/5e-4))),h=dtT/steps;let V=new Map(),known;
    for(let s=0;s<steps;s++){
      known=new Map();
      for(const [net,v] of strong)if(!disch.has(net))known.set(net,v===Hh?5:v===L?0:2.5);
      for(const [net,c] of disch)if(rt(c).st.q===L)known.set(net,0);
      // 미지 노드: 커패시터 단자에서 저항·커패시터로 닿는 줄 (알려진 줄에서 멈춤)
      const U=[],ix=new Map(),stack=[];for(const e of Cl)for(const n of [e.a,e.b])if(!known.has(n)&&!ix.has(n)){ix.set(n,U.length);U.push(n);stack.push(n);}
      while(stack.length){const n=stack.pop();for(const m of adj.get(n)||[])if(!known.has(m)&&!ix.has(m)){ix.set(m,U.length);U.push(m);stack.push(m);}}
      const N_=U.length,A=Array.from({length:N_},()=>new Float64Array(N_+1));
      for(let i=0;i<N_;i++)A[i][i]+=1e-9;
      const stamp=(a,b,G,I)=>{const ia=ix.get(a),ib=ix.get(b),va=known.get(a),vb=known.get(b);
        if(ia!==undefined){A[ia][ia]+=G;if(ib!==undefined)A[ia][ib]-=G;else A[ia][N_]+=G*vb;A[ia][N_]+=I;}
        if(ib!==undefined){A[ib][ib]+=G;if(ia!==undefined)A[ib][ia]-=G;else A[ib][N_]+=G*va;A[ib][N_]-=I;}};
      for(const [a,b,G] of Rl)if(a!==b&&(ix.has(a)||ix.has(b)))stamp(a,b,G,0);
      for(const e of Cl){if(e.a===e.b){e.r.v=0;continue;}const G=e.C/h;stamp(e.a,e.b,G,G*(e.r.v||0));}
      for(let i=0;i<N_;i++){let p=i;for(let r=i+1;r<N_;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;[A[i],A[p]]=[A[p],A[i]];
        const d=A[i][i]||1e-12;for(let r=0;r<N_;r++){if(r===i)continue;const f=A[r][i]/d;if(f)for(let k=i;k<=N_;k++)A[r][k]-=f*A[i][k];}}
      V=new Map();U.forEach((n,i)=>V.set(n,A[i][N_]/(A[i][i]||1e-12)));
      const vn=n=>V.has(n)?V.get(n):known.has(n)?known.get(n):null;
      for(const e of Cl){const a=vn(e.a),b=vn(e.b);if(a!=null&&b!=null)e.r.v=a-b;}
      for(const c of t555){const d=CHIPS[c.chip],hs=ph.get(c.id);const va=k=>{const n=netOf[hs[d.idx[k]]];const x=vn(n);return x!=null?x:vOf(n);};
        const g=k=>{const v=lvl.get(netOf[hs[d.idx[k]]]);return v===L||v===Hh?v:Hh;};d.eval(g,rt(c).st,va);}
    }
    volt=V;
  }
  resolve();analogStep();
  let stable=false;
  for(let it=0;it<80;it++){
    resolve();let changed=false;
    for(const c of ics){const d=defOf(c),r=rt(c),hs=ph.get(c.id);
      const lv=k=>{const v=lvl.get(netOf[hs[k]]);return v===undefined?Z:v;};
      const pw=S.power&&(d.free||(lv(d.idx[d.vcc])===Hh&&lv(d.idx[d.gnd])===L));
      let out=null;
      if(pw){if(!r.st)r.st=d.init?d.init():{};
        const g=nm=>{const v=lv(d.idx[nm]);return v===L||v===Hh?v:(d.ttl&&v===Z)?Hh:X;};
        const va=nm=>vOf(netOf[hs[d.idx[nm]]]);
        const o=d.eval(g,r.st,va);out=d.pins.map(p=>p in o?o[p]:Z);}
      else r.st=null;
      const prev=r.out;
      if(!(prev===out||(prev&&out&&prev.every((v,k)=>v===out[k]))))changed=true;
      r.out=out;r.pw=pw;}
    if(!changed){stable=true;break;}
  }
  resolve();
  SIM.netOf=netOf;SIM.lvl=lvl;SIM.weak=weak;SIM.unstable=!stable;SIM.ph=ph;SIM.volt=volt;SIM.vOf=vOf;
  // 결과 해석
  const W_=[];const lvAt=i=>{const v=lvl.get(netOf[i]);return v===undefined?Z:v;};
  SIM.led=new Map();SIM.seg=new Map();
  const shortNets=new Set();for(const [net,v] of lvl)if(v===SH&&!weak.has(net))shortNets.add(net);
  if(S.power){
    const railShort=[RAIL.tp,RAIL.bp,RAIL.tn,RAIL.bn].some(i=>shortNets.has(netOf[i]));
    if(railShort)W_.push(['bad','전원 단락! + 레일과 − 레일이 전선이나 스위치로 바로 이어져 있어요. 실제 회로라면 전원 장치가 꺼지거나 부품이 탈 수 있어요.']);
    else if(shortNets.size)W_.push(['bad','출력 충돌! 한 줄에 HIGH와 LOW가 동시에 들어오고 있어요(출력끼리 또는 출력과 전원이 바로 연결됨). 해당 전선은 자주색으로 깜박여요.']);
  }
  for(const c of S.comps){const hs=ph.get(c.id);
    if(c.t==='ic'&&S.power&&!rt(c).pw){const d=CHIPS[c.chip];
      W_.push(['warn',`${LBL.get(c.id)} ${c.chip}에 전원이 안 들어가요. ${d.idx[d.vcc]+1}번 핀(${d.vcc})을 + 에, ${d.idx[d.gnd]+1}번 핀(${d.gnd})을 − 에 연결하세요.`]);}
    if(c.t==='led'){const a=lvAt(hs[0]),k=lvAt(hs[1]);const lit=a===Hh&&k===L;
      const noR=lit&&!weak.has(netOf[hs[0]])&&!weak.has(netOf[hs[1]]);
      SIM.led.set(c.id,{lit,noR,rev:a===L&&k===Hh});
      if(noR)W_.push(['warn',`${LBL.get(c.id)} LED에 저항 없이 전압이 바로 걸려 있어요. 실제로는 LED가 탈 수 있으니 220Ω~1kΩ 저항을 직렬로 넣으세요.`]);
      if(a===L&&k===Hh)W_.push(['warn',`${LBL.get(c.id)} LED가 거꾸로 꽂혀 있어요. 긴 다리(애노드, +)가 높은 전압 쪽이어야 켜져요.`]);}
    if(c.t==='cap'&&S.power&&c.farad>=1e-6&&(rt(c).v||0)<-0.5)W_.push(['warn',`${LBL.get(c.id)} 전해 커패시터의 극성이 반대예요. + 극(처음 누른 쪽)이 높은 전압 쪽이어야 해요. 실제로는 터질 수 있어요.`]);
    if(c.t==='seg7'){const v=hs.map(lvAt),on={},act=c.ca?L:Hh,cv=c.ca?Hh:L;const com=v[2]===cv||v[7]===cv;
      SEG7PINS.forEach((s,i)=>{if(s!=='COM')on[s]=com&&v[i]===act;});SIM.seg.set(c.id,on);}
  }
  if(SIM.unstable)W_.push(['warn','회로가 한 상태로 멈추지 않고 계속 바뀌고 있어요(발진). 출력이 자기 입력으로 되돌아가는 연결이 있는지 확인하세요.']);
  if(!S.power)W_.unshift(['warn','전원이 꺼져 있어요. 위쪽 [전원] 버튼을 눌러 켜세요.']);
  SIM.warns=W_;
}

/* 데이터시트 형식 핀 배치도: 위에서 본 모습, 노치 위쪽, 1번 핀 왼쪽 위 → 왼쪽 아래로, 오른쪽 아래 → 위로 */
function pinoutSVG(d,lv){const n=d.pins.length,h=n/2,pt=21,top=30,bw=84,bx=104,VW=292,VH=top+h*pt+26;
  const nm=(t,x,y,anc,col)=>`<text x="${x}" y="${y}" text-anchor="${anc}" font-size="11.5" font-weight="600" font-family="var(--mono)" fill="${col}">${t[0]==='~'?`<tspan text-decoration="overline">${esc(t.slice(1))}</tspan>`:esc(t)}</text>`;
  const pcol=t=>t===d.vcc?'var(--hi)':t===d.gnd?'var(--lo)':'var(--fg)';
  const dot=(k,x,y)=>{if(!lv)return'';const v=lv[k];return`<circle cx="${x}" cy="${y}" r="4.2" fill="${LVCOLS[v]}"><title>${esc(lvText(v))}</title></circle>`;};
  let s=`<svg viewBox="0 0 ${VW} ${VH}" width="100%" style="max-width:310px;display:block;margin:2px auto 4px" role="img" aria-label="${esc(d.name)} 핀 배치도">`;
  s+=`<rect x="${bx}" y="${top-14}" width="${bw}" height="${h*pt+6}" rx="3" fill="var(--surface)" stroke="var(--fg)" stroke-width="1.4"/>
    <path d="M${bx+bw/2-10} ${top-14} a10 10 0 0 0 20 0" fill="var(--panel)" stroke="var(--fg)" stroke-width="1.4"/>
    <circle cx="${bx+bw/2-20}" cy="${top-6}" r="2.6" fill="var(--fg)"/>
    <text x="${bx+bw/2}" y="${top-14+(h*pt+6)/2}" text-anchor="middle" font-size="12" font-weight="700" font-family="var(--mono)" fill="var(--fg)" transform="rotate(-90 ${bx+bw/2} ${top-14+(h*pt+6)/2})" dy="4">${esc(d.name)}</text>`;
  for(let i=0;i<h;i++){const y=top+i*pt+3,L=i,Rk=n-1-i;
    s+=`<line x1="${bx-16}" x2="${bx}" y1="${y}" y2="${y}" stroke="var(--fg)" stroke-width="1.6"/><line x1="${bx+bw}" x2="${bx+bw+16}" y1="${y}" y2="${y}" stroke="var(--fg)" stroke-width="1.6"/>
      <text x="${bx+5}" y="${y+4}" font-size="10" font-family="var(--mono)" fill="var(--muted)">${L+1}</text><text x="${bx+bw-5}" y="${y+4}" text-anchor="end" font-size="10" font-family="var(--mono)" fill="var(--muted)">${Rk+1}</text>`;
    s+=nm(d.pins[L],bx-22-(lv?10:0),y+4,'end',pcol(d.pins[L]))+nm(d.pins[Rk],bx+bw+22+(lv?10:0),y+4,'start',pcol(d.pins[Rk]));
    s+=dot(L,bx-24,y)+dot(Rk,bx+bw+24,y);}
  s+=`<text x="${VW/2}" y="${VH-6}" text-anchor="middle" font-size="10" fill="var(--muted)">위에서 본 모습 (Top view) · 노치가 위쪽</text></svg>`;
  return s;}
const LVCOLS=['var(--lo)','var(--hi)','var(--xx)','var(--zz)','var(--sh)'];
function truthTable(d){const ins=d.gates[0].ins.map(p=>p.replace(/^\d/,'')),k=ins.length,rows=[];

function applySnap(t){const s=JSON.parse(t);S.comps=s.comps;S.nextId=s.nextId;S.power=s.power;RT.clear();if(sel&&sel.type==='comp'&&!compById(sel.id))sel=null;syncHist();commit(true);}

document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;

$('ex').onchange=()=>{const k=$('ex').value;$('ex').value='';if(!k)return;
  S.power=true;loadComps(EXAMPLES[k]());toast('예제를 불러왔어요 · 이전 회로는 실행 취소로 되돌릴 수 있어요');};
$('zi').onclick=$('hzi').onclick=()=>zoomAt(1.2);$('zo').onclick=$('hzo').onclick=()=>zoomAt(1/1.2);$('fit').onclick=$('hfit').onclick=fitView;
$('delb').onclick=()=>{if(sel&&sel.type==='comp')delComp(sel.id);else toast('먼저 지울 부품을 선택하세요');};
$('redo').onclick=()=>redo();
/* 테마 */
function setTheme(t){document.documentElement.dataset.theme=t;store.set('theme',t);$('theme').textContent=t==='dark'?'밝은 화면':'어두운 화면';}
setTheme(store.get('theme','dark'));$('theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
/* 오른쪽 탭 */
let tab='info';
function showTab(t){tab=t;document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  $('info').hidden=t!=='info';$('paneWarn').hidden=t!=='warn';$('paneObj').hidden=t!=='obj';}
document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
/* 객체 목록 */
function compLoc(c){const hs=pinHoles(c);return c.t==='ic'||c.t==='seg7'?`${c.col}~${c.col+hs.length/2-1}열`:hs.join('–');}
function renderObjs(){$('ocount').textContent=S.comps.length;$('sCount').textContent='부품 '+S.comps.length;
  if(tab!=='obj')return;
  $('objlist').innerHTML=S.comps.length?[...S.comps].sort((a,b)=>(a.t==='wire')-(b.t==='wire')).map(c=>{let dot='transparent';
    if(c.t==='ic')dot=!S.power?'var(--zz)':rt(c).pw?'var(--ok)':'var(--bad)';else if(c.t==='led')dot=(SIM.led.get(c.id)||{}).lit?(LEDC[c.color]||LEDC.red)[0]:'transparent';
    else if(c.t==='wire')dot=c.color;else if(c.t==='sw')dot=c.on?'var(--ok)':'var(--zz)';
    return`<button class="orow" data-oid="${c.id}" aria-selected="${!!(sel&&sel.id===c.id)}"><span class="k">${esc(LBL.get(c.id))}</span><span>${esc(compName(c))}</span><span class="loc">${esc(compLoc(c))}</span><span class="d" style="background:${dot}"></span></button>`;}).join('')
    :'<p class="desc">보드에 부품이 없어요.</p>';
  $('objlist').querySelectorAll('[data-oid]').forEach(b=>{b.onclick=()=>{sel={type:'comp',id:+b.dataset.oid};render();renderInfo();};
    b.ondblclick=()=>{const c=compById(+b.dataset.oid);const hs=pinHoles(c).map(id=>HOLES.get(id));const mx=hs.reduce((a,h)=>a+h.x,0)/hs.length,my=hs.reduce((a,h)=>a+h.y,0)/hs.length;
      view.s=Math.max(view.s,1.6);view.x=mx-cw()/view.s/2;view.y=my-ch()/view.s/2;applyView();};});}
document.querySelector('[data-tab="obj"]').addEventListener('click',()=>renderObjs());
/* 라이브러리 검색 */
$('search').addEventListener('input',()=>{const q=$('search').value.trim().toLowerCase();
  document.querySelectorAll('#lib details.sec').forEach(d=>{let any=false;d.querySelectorAll('.it').forEach(b=>{const m=!q||b.textContent.toLowerCase().includes(q);b.hidden=!m;any=any||m;});
    d.hidden=!any;if(q&&any)d.open=true;});});

/* ───────── 예제 회로 ───────── */
const w=(a,b,color='#D93A3A')=>({t:'wire',pins:[a,b],color});
const R=(a,b,ohms=330)=>({t:'res',pins:[a,b],ohms});
const RED='#D93A3A',BLK='#24282D',BLU='#2F6FDB',GRN='#2E9E5B',YEL='#E8B820',ORG='#E57A1F',PUR='#8B5CD6';
const EXAMPLES={
  gates:()=>[
    {t:'sw',pins:['tp3','a3'],on:false},w('e3','f3',YEL),R('j3','bn3',10000),
    {t:'sw',pins:['tp5','a5'],on:false},w('e5','f5',ORG),R('j5','bn5',10000),
    {t:'gate',kind:'AND',pins:['e10','e11','e14']},{t:'gate',kind:'OR',pins:['e18','e19','e22']},
    {t:'gate',kind:'XOR',pins:['e26','e27','e30']},{t:'gate',kind:'NOT',pins:['e34','e38']},
    w('b3','a10',YEL),w('b5','a11',ORG),w('c3','a18',YEL),w('c5','a19',ORG),w('d3','a26',YEL),w('d5','a27',ORG),w('g3','a34',YEL),
    w('b14','g14',BLU),R('i14','i16'),{t:'led',pins:['j16','bn16'],color:'red'},
    w('b22','g22',BLU),R('i22','i25'),{t:'led',pins:['j25','bn25'],color:'green'},
    w('b30','g30',BLU),R('i30','i32'),{t:'led',pins:['j32','bn32'],color:'yellow'},
    w('b38','g38',BLU),R('i38','i40'),{t:'led',pins:['j40','bn40'],color:'blue'}],
  sync10:()=>[
    // 그림 7-9: U2·U3 = 74LS76 (JK 플립플롭 4개), U1 = 74LS08 (AND 3개 사용)
    // J0=K0=1 · J1=Q0·Q̅3, K1=Q0 · J2=K2=Q0·Q1 · J3=Q0·Q1·Q2, K3=Q0
    {t:'ic',chip:'74LS76',col:8},{t:'ic',chip:'74LS76',col:20},{t:'ic',chip:'74LS08',col:32},
    // 전원: 74LS76은 VCC 5번(f12, f24), GND 13번(e11, e23)
    w('j12','bp13',RED),w('a11','tn11',BLK),w('j24','bp25',RED),w('a23','tn23',BLK),w('a32','tp32',RED),w('j38','bn38',BLK),
    // FF0: J0 = K0 = VCC
    w('i11','bp11',RED),w('a8','tp8',RED),
    // 공통 CLK (노랑) · PR (주황) · CLR (보라)
    {t:'clk',pins:['j8'],hz:1},w('g8','g13',YEL),w('h13','h20',YEL),w('g20','g25',YEL),
    w('h9','h14',ORG),w('i14','i21',ORG),w('h21','h26',ORG),
    w('i10','i15',PUR),w('j15','j22',PUR),w('i22','i27',PUR),
    // PR 스위치(2열) · CLR 스위치(4열): 켜면 HIGH, 끄면 1kΩ 풀다운으로 LOW
    {t:'sw',pins:['tp2','a2'],on:true},w('e2','f2',ORG),R('j2','bn2',1000),w('g2','j9',ORG),
    {t:'sw',pins:['tp4','a4'],on:true},w('e4','f4',PUR),R('j4','bn4',1000),w('g4','j10',PUR),
    // K1 = Q0, K3 = Q0
    w('d9','d12',GRN),w('c9','c24',GRN),
    // U1:A  Q0·Q̅3 → J1
    w('b9','g32',GRN),w('d26','g33',BLU),w('g34','d15',BLU),
    // U1:B  Q0·Q1 → J2, K2
    w('h32','g35',GRN),w('d13','g36',BLU),w('g37','g23',BLU),w('h23','d20',BLU),
    // U1:C  (Q0·Q1)·Q2 → J3
    w('h37','d37',BLU),w('d21','d36',GRN),w('d38','d27',BLU),
    // 출력 LED: Q3 Q2 Q1 Q0 (왼쪽이 높은 자리)
    w('a25','a41',RED),R('e41','f41',330),{t:'led',pins:['j41','bn41'],color:'red'},
    w('a21','a43',RED),R('e43','f43',330),{t:'led',pins:['j43','bn43'],color:'yellow'},
    w('a13','a45',RED),R('e45','f45',330),{t:'led',pins:['j45','bn45'],color:'green'},
    w('a9','a47',RED),R('e47','f47',330),{t:'led',pins:['j47','bn47'],color:'blue'}],
  t555:()=>[
    // NE555 (1 GND f20, 2 TRIG f21, 3 OUT f22, 4 RESET f23, 5 CTRL e23, 6 THRES e22, 7 DISCH e21, 8 VCC e20)
    {t:'ic',chip:'NE555',col:20},
    w('a20','tp20',RED),w('j20','bn20',BLK),w('j23','bp23',RED),
    {t:'res',pins:['tp21','b21'],ohms:1000},            // R1: VCC → DISCH
    {t:'res',pins:['c21','c22'],ohms:10000},            // R2: DISCH → THRES
    w('d22','g21',GRN),                                  // THRES ↔ TRIG
    {t:'cap',pins:['i21','bn21'],farad:4.7e-5},          // C: TRIG → GND (47µF)
    {t:'cap',pins:['b23','tn23'],farad:1e-8},            // CTRL → GND (0.01µF)
    {t:'res',pins:['h22','h26'],ohms:330},{t:'led',pins:['j26','bn26'],color:'red'}],
  ls90:()=>[
    {t:'ic',chip:'74LS90',col:4},{t:'ic',chip:'74LS47',col:20},{t:'seg7',col:35,ca:true},
    // 74LS90: VCC 5번(f8), GND 10번(e8), R0·R9 → −
    w('j8','bp8',RED),w('a8','tn8',BLK),w('j5','bn5',BLK),w('j6','bn7',BLK),w('j9','bn9',BLK),w('j10','bn10',BLK),
    {t:'clk',pins:['b4'],hz:2},          // CKA(14번, e4)에 클럭
    w('c6','g4',GRN),                     // QA(12번) → CKB(1번) : 10진 연결
    w('d6','g26',YEL),w('d9','g20',ORG),w('d10','g21',GRN),w('d7','g25',BLU),
    w('a20','tp20',RED),w('j27','bn27',BLK),w('j22','bp22',RED),w('j23','bp23',RED),w('j24','bp25',RED),
    w('a23','a38',PUR),w('b24','b39',PUR),w('b25','h38',PUR),w('c26','i36',PUR),w('d27','j35',PUR),w('c21','c36',PUR),w('d22','d35',PUR),
    {t:'res',pins:['j37','bp37'],ohms:330}],
  ls47:()=>[
    {t:'ic',chip:'74LS47',col:20},{t:'seg7',col:35,ca:true},
    w('a20','tp20',RED),w('j27','bn27',BLK),w('j22','bp22',RED),w('j23','bp23',RED),w('j24','bp25',RED),
    // 입력 스위치 A(3) B(5) C(9) D(11), 10kΩ 풀다운
    {t:'sw',pins:['tp3','a3'],on:false},w('e3','f3',YEL),R('j3','bn3',10000),
    {t:'sw',pins:['tp5','a5'],on:false},w('e5','f5',ORG),R('j5','bn5',10000),
    {t:'sw',pins:['tp9','a9'],on:false},w('e9','f9',GRN),R('j9','bn9',10000),
    {t:'sw',pins:['tp11','a11'],on:false},w('e11','f11',BLU),R('j11','bn11',10000),
    w('g3','g26',YEL),w('g5','g20',ORG),w('g9','g21',GRN),w('g11','g25',BLU),
    // 출력(LOW면 켜짐) → 공통 애노드 7세그먼트, COM은 330Ω을 거쳐 +
    w('a23','a38',PUR),w('b24','b39',PUR),w('b25','h38',PUR),w('c26','i36',PUR),w('d27','j35',PUR),w('c21','c36',PUR),w('d22','d35',PUR),
    R('j37','bp37',330)],
  nand:()=>[
    {t:'ic',chip:'74HC00',col:20},
    w('a20','tp20',RED),w('j26','bn26',BLK),
    {t:'sw',pins:['tp13','a13'],on:false},w('e13','g20',YEL),R('j20','bn20',10000),
    {t:'sw',pins:['tp16','a16'],on:false},w('e16','g21',ORG),R('j21','bn21',10000),
    w('h22','h31',GRN),R('i31','i34',330),{t:'led',pins:['j34','bn34'],color:'red'}],
  dff:()=>[
    {t:'ic',chip:'74HC74',col:14},
    w('a14','tp14',RED),w('j20','bn20',BLK),w('j14','bp13',RED),w('j17','bp17',RED),
    w('a15','tp15',RED),w('a18','tp19',RED),
    w('h15','h19',BLU),
    {t:'btn',pins:['tp9','a9']},w('e9','g16',YEL),R('j16','bn16',10000),
    R('i18','i23',330),{t:'led',pins:['j23','bn23'],color:'green'}],
  counter:()=>[
    {t:'ic',chip:'74HC161',col:5},{t:'ic',chip:'CD4511',col:20},{t:'seg7',col:35},{t:'ic',chip:'74HC00',col:42},
    // 74HC161 전원·제어
    w('a5','tp5',RED),w('j12','bn13',BLK),w('j5','bp5',RED),w('j11','bp11',RED),w('a11','tp11',RED),
    {t:'clk',pins:['i6'],hz:1},
    // 불러올 값 DCBA = 0000
    w('j7','bn7',BLK),w('j8','bn8',BLK),w('j9','bn9',BLK),w('j10','bn10',BLK),
    // Q 출력 → 4511 입력
    w('d7','g26',YEL),w('c8','g20',ORG),w('b9','g21',GRN),w('a10','g25',BLU),
    // 4511 전원·제어
    w('a20','tp20',RED),w('j27','bn27',BLK),w('j22','bp22',RED),w('j23','bp23',RED),w('j24','bn25',BLK),
    // 4511 a~g → 7세그먼트
    w('a23','a38',PUR),w('b24','b39',PUR),w('b25','h38',PUR),w('c26','i36',PUR),w('d27','j35',PUR),w('c21','c36',PUR),w('d22','d35',PUR),
    w('j37','bn37',BLK),
    // 9(QD=1, QA=1)가 되면 NAND 출력이 LOW → 다음 클럭에 0000을 불러와 0으로 돌아감
    w('a42','tp43',RED),w('j48','bn49',BLK),
    w('c7','g42',YEL),w('b10','g43',BLU),w('h44','c12',GRN)],
  adder:()=>[
    // 전가산기: S = A⊕B⊕Cin, Cout = A·B + Cin·(A⊕B)
    {t:'ic',chip:'74HC86',col:13},{t:'ic',chip:'74HC08',col:22},{t:'ic',chip:'74HC32',col:31},
    w('a13','tp13',RED),w('j19','bn19',BLK),w('a22','tp22',RED),w('j28','bn28',BLK),w('a31','tp31',RED),w('j37','bn37',BLK),
    // 입력 스위치 A(3열) B(5열) Cin(9열) + 10kΩ 풀다운
    {t:'sw',pins:['tp3','a3'],on:false},w('e3','f3',YEL),R('j3','bn3',10000),
    {t:'sw',pins:['tp5','a5'],on:false},w('e5','f5',ORG),R('j5','bn5',10000),
    {t:'sw',pins:['tp9','a9'],on:false},w('e9','f9',GRN),R('j9','bn9',10000),
    // XOR1: A⊕B (1Y)  →  XOR2: (A⊕B)⊕Cin = S (2Y)
    w('g3','g13',YEL),w('h5','g14',ORG),w('h15','g16',BLU),w('g9','h17',GRN),
    // AND1: A·B   AND2: (A⊕B)·Cin
    w('h3','g22',YEL),w('i5','g23',ORG),w('i15','g25',BLU),w('h9','g26',GRN),
    // OR: AND1 + AND2 = Cout
    w('h24','g31',PUR),w('h27','g32',PUR),
    // 출력 LED: S(노랑) · Cout(빨강)
    w('h18','h40',BLU),R('i40','i43',330),{t:'led',pins:['j43','bn43'],color:'yellow'},
    w('h33','h46',PUR),R('i46','i49',330),{t:'led',pins:['j49','bn49'],color:'red'}],
};
</script>
<script>
'use strict';
/* ───────── 시작 ───────── */
(function start(){
  // 링크 끝에 #예제이름 이 붙어 있으면 그 예제를 바로 연다 (예: …#sync10)
  const hashEx=()=>{const k=(location.hash||'').slice(1);return Object.prototype.hasOwnProperty.call(EXAMPLES,k)?k:null;};
  const openHash=(first)=>{const k=hashEx();if(!k)return false;S.power=true;loadComps(EXAMPLES[k](),first);
    const o=[...$('ex').options].find(o=>o.value===k);toast((o?o.textContent:'예제')+' 회로를 열었어요');
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}return true;};
  window.addEventListener('hashchange',()=>{if(openHash(false)){fitView();}});
  const saved=store.get('circuit',null);
  if(openHash(true)){}
  else if(saved&&Array.isArray(saved.comps)){S.power=saved.power!==false;loadComps(saved.comps,true);}
  else loadComps(EXAMPLES.nand(),true);
  hist.length=0;fut.length=0;syncHist();
  fitView();requestAnimationFrame(fitView);setTool('select');syncPower();renderInfo();
  let lastSig='';
  setInterval(()=>{if(!S.power||drag)return;const now=performance.now()/1000;
    const clks=S.comps.filter(c=>c.t==='clk'),caps=S.comps.some(c=>c.t==='cap');if(!clks.length&&!SIM.unstable&&!caps)return;
    const sig=clks.map(c=>clkVal(c,now)).join('');
    if(caps){settle();const ns=snapOut();if(ns!==lastOut||sig!==lastSig||++frame%4===0){lastOut=ns;lastSig=sig;render();}return;}
    if(sig!==lastSig||SIM.unstable){lastSig=sig;settle();render();}},20);
  let lastOut='',frame=0;
  function snapOut(){return S.comps.map(c=>c.t==='ic'?(rt(c).out||[]).join(''):c.t==='led'?+((SIM.led.get(c.id)||{}).lit||0):'').join('|');}
  // 단락 전선 깜박임
})();
</script>
